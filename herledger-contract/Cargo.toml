[workspace]
resolver = "2"
members = [
    "contracts/business_registry",
    "contracts/financial_ledger",
    "contracts/attestation_registry",
]

[workspace.dependencies]
soroban-sdk = { version = "=26.0.1" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
